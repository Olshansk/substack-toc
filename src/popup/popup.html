<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Substack ToC</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1 id="title">Substack ToC</h1>
    <p id="subtitle" class="subtitle"></p>
  </header>

  <main>
    <div id="loading" class="state-message">
      <span class="spinner"></span>
      <span>Scanning for headings...</span>
    </div>

    <div id="error" class="state-message error" style="display: none;"></div>

    <div id="content" style="display: none;">
      <div class="toc-header">
        <span class="toc-count"></span>
        <button id="copy-all" class="btn-secondary" title="Copy the formatted table of contents">
          Copy All
        </button>
      </div>

      <label class="list-style-control" for="list-style">
        List style
        <select id="list-style">
          <option value="numbered">Numbered</option>
          <option value="bulleted">Bulleted</option>
        </select>
      </label>

      <div id="toc-preview"></div>

      <button id="inject-btn" class="btn-primary" disabled>
        Inject into Post
      </button>

      <p class="hint">Inserts ToC at cursor position in editor</p>
    </div>
  </main>

  <script src="../shared/toc.js"></script>
  <script src="../shared/preferences.js"></script>
  <script src="../content/editor.js"></script>
  <script src="popup.js"></script>
</body>
</html>
